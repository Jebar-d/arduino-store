<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <title>Admin — ARduino Store</title>
  <link rel="icon" type="image/png" href="/public/logo2.png">
  <link rel="stylesheet" href="/src/style.css"/>
  <style>
    :root {
      --adm-bg: #0d0d0f;
      --adm-surface: #141417;
      --adm-card: #1a1a1e;
      --adm-border: rgba(119,207,207,0.12);
      --adm-primary: #77CFCF;
      --adm-accent: #5fa9a9;
      --adm-danger: #ff4d4d;
      --adm-warning: #f5a623;
      --adm-success: #2ecc71;
      --adm-text: #f0f0f0;
      --adm-text2: #8a8a9a;
      --adm-sidebar: 240px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--adm-bg); color: var(--adm-text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
    #nav, footer, .site-footer, header#nav, .navbar, .sidebar, .sidebar-overlay { display: none !important; }

    .adm-layout { display: flex; min-height: 100vh; width: 100%; }

    /* Sidebar */
    .adm-sidebar { width: var(--adm-sidebar); background: var(--adm-surface); border-right: 1px solid var(--adm-border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 1000; height: 100vh; overflow-y: auto; }
    .adm-logo { padding: 1.25rem 1.25rem; border-bottom: 1px solid var(--adm-border); display: flex; align-items: center; gap: 0.75rem; }
    .adm-logo img { height: 1.75rem; }
    .adm-logo-text { font-size: 0.7rem; color: var(--adm-primary); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .adm-nav { flex: 1; padding: 0.75rem 0; overflow-y: auto; }
    .adm-nav-section { padding: 0.75rem 1.25rem 0.25rem; font-size: 0.62rem; color: var(--adm-text2); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
    .adm-nav a { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 1.25rem; color: var(--adm-text2); text-decoration: none; font-size: 0.85rem; font-weight: 500; border-left: 2px solid transparent; transition: all 0.15s; }
    .adm-nav a:hover { color: var(--adm-text); background: rgba(119,207,207,0.05); }
    .adm-nav a.active { color: var(--adm-primary); border-left-color: var(--adm-primary); background: rgba(119,207,207,0.08); font-weight: 600; }
    .adm-sidebar-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--adm-border); font-size: 0.75rem; color: var(--adm-text2); }
    .adm-sidebar-footer a { color: var(--adm-primary); text-decoration: none; font-size: 0.75rem; }

    /* Main */
    .adm-main { margin-left: var(--adm-sidebar); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .adm-topbar { background: var(--adm-surface); border-bottom: 1px solid var(--adm-border); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 99; }
    .adm-breadcrumb { font-size: 0.82rem; color: var(--adm-text2); }
    .adm-breadcrumb span { color: var(--adm-text); font-weight: 600; }
    .adm-user-badge { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: var(--adm-text2); }
    .adm-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--adm-primary), var(--adm-accent)); display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; color: #000; }
    .adm-content { padding: 1.75rem 2rem; flex: 1; }

    /* Stats */
    .adm-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
    .adm-stat { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 10px; padding: 1.1rem 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .adm-stat-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ic-teal { background: rgba(119,207,207,0.12); color: var(--adm-primary); }
    .ic-green { background: rgba(46,204,113,0.12); color: var(--adm-success); }
    .ic-orange { background: rgba(245,166,35,0.12); color: var(--adm-warning); }
    .ic-red { background: rgba(255,77,77,0.12); color: var(--adm-danger); }
    .adm-stat-val { font-size: 1.4rem; font-weight: 700; line-height: 1; }
    .adm-stat-lbl { font-size: 0.75rem; color: var(--adm-text2); margin-top: 0.2rem; }

    /* Page header */
    .adm-ph { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem; }
    .adm-ph-title { font-size: 1.35rem; font-weight: 700; }
    .adm-ph-sub { font-size: 0.82rem; color: var(--adm-text2); margin-top: 0.15rem; }

    /* Toolbar */
    .adm-toolbar { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .adm-search { position: relative; flex: 1; min-width: 180px; }
    .adm-search input { width: 100%; background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 8px; padding: 0.55rem 0.9rem 0.55rem 2.25rem; color: var(--adm-text); font-size: 0.85rem; outline: none; }
    .adm-search input:focus { border-color: var(--adm-primary); }
    .adm-search svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--adm-text2); pointer-events: none; }
    .adm-sel { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 8px; padding: 0.55rem 0.9rem; color: var(--adm-text); font-size: 0.85rem; outline: none; }

    /* Table */
    .adm-tw { overflow-x: auto; border-radius: 10px; border: 1px solid var(--adm-border); }
    .adm-t { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .adm-t thead { background: rgba(119,207,207,0.04); }
    .adm-t th { padding: 0.8rem 1rem; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--adm-text2); font-weight: 700; border-bottom: 1px solid var(--adm-border); }
    .adm-t td { padding: 0.8rem 1rem; border-bottom: 1px solid rgba(119,207,207,0.05); vertical-align: middle; }
    .adm-t tr:last-child td { border-bottom: none; }
    .adm-t tr:hover td { background: rgba(119,207,207,0.025); }
    .adm-t img { width: 38px; height: 38px; object-fit: cover; border-radius: 6px; border: 1px solid var(--adm-border); }

    /* Badges */
    .b { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; }
    .b-g { background: rgba(46,204,113,0.12); color: #2ecc71; }
    .b-r { background: rgba(255,77,77,0.12); color: #ff4d4d; }
    .b-o { background: rgba(245,166,35,0.12); color: #f5a623; }
    .b-t { background: rgba(119,207,207,0.12); color: #77CFCF; }
    .b-gray { background: rgba(138,138,154,0.12); color: #8a8a9a; }

    /* Buttons */
    .adm-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.65rem 1.25rem; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.15s; text-decoration: none; }
    .adm-btn-p { background: var(--adm-primary); color: #000; }
    .adm-btn-p:hover { background: var(--adm-accent); }
    .adm-btn-o { background: transparent; border: 1px solid var(--adm-border); color: var(--adm-text2); }
    .adm-btn-o:hover { border-color: var(--adm-primary); color: var(--adm-primary); }
    .adm-btn-d { background: rgba(255,77,77,0.1); border: 1px solid rgba(255,77,77,0.25); color: #ff4d4d; }
    .adm-btn-d:hover { background: rgba(255,77,77,0.18); }
    .adm-btn-s { padding: 0.35rem 0.75rem; font-size: 0.76rem; }
    .adm-btn-full { width: 100%; }

    /* Modal */
    .adm-mo { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .adm-mo.open { opacity: 1; pointer-events: all; }
    .adm-mb { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 14px; padding: 1.75rem; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; }
    .adm-mo.open .adm-mb { transform: translateY(0); }
    .adm-mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .adm-mt { font-size: 1.05rem; font-weight: 700; }
    .adm-mx { background: none; border: none; color: var(--adm-text2); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0.2rem; }
    .adm-mx:hover { color: var(--adm-text); }
    .adm-mf { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }

    /* Form groups */
    .fg { margin-bottom: 0.9rem; }
    .fg label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--adm-text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.35rem; }
    .fg input, .fg select, .fg textarea { width: 100%; background: var(--adm-surface); border: 1px solid var(--adm-border); border-radius: 7px; padding: 0.65rem 0.85rem; color: var(--adm-text); font-size: 0.875rem; outline: none; transition: border-color 0.15s; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--adm-primary); }
    .fg textarea { resize: vertical; min-height: 75px; }
    .fg select option { background: var(--adm-surface); }
    .fg input[type=file] { color: var(--adm-text2); padding: 0.45rem 0.85rem; }
    .fr { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }

    /* Toast */
    .adm-toast { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 9px; padding: 0.8rem 1.1rem; font-size: 0.83rem; font-weight: 500; min-width: 200px; transform: translateY(60px); opacity: 0; transition: all 0.25s; }
    .adm-toast.show { transform: translateY(0); opacity: 1; }
    .adm-toast.success { border-left: 3px solid var(--adm-success); }
    .adm-toast.error { border-left: 3px solid var(--adm-danger); }
    .adm-toast.info { border-left: 3px solid var(--adm-primary); }

    /* Confirm */
    .adm-co { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .adm-co.open { opacity: 1; pointer-events: all; }
    .adm-cb { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 12px; padding: 1.75rem; max-width: 360px; width: 100%; text-align: center; }
    .adm-cb h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.4rem; }
    .adm-cb p { font-size: 0.83rem; color: var(--adm-text2); margin-bottom: 1.25rem; }
    .adm-ca { display: flex; gap: 0.75rem; justify-content: center; }

    /* Auth gate */
    .adm-gate { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .adm-gate-box { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 14px; padding: 2.25rem; max-width: 400px; width: 100%; text-align: center; }
    .adm-gate-box img { height: 2.5rem; margin-bottom: 1.25rem; }
    .adm-gate-box h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.4rem; }
    .adm-gate-box p { font-size: 0.83rem; color: var(--adm-text2); margin-bottom: 1.25rem; }

    /* Empty / loader */
    .adm-empty { text-align: center; padding: 3.5rem 2rem; color: var(--adm-text2); font-size: 0.875rem; }
    .adm-spin { width: 28px; height: 28px; border: 2px solid var(--adm-border); border-top-color: var(--adm-primary); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Quick cards (dashboard) */
    .adm-qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .adm-qc { background: var(--adm-card); border: 1px solid var(--adm-border); border-radius: 10px; padding: 1.25rem; text-decoration: none; color: var(--adm-text); transition: all 0.15s; display: flex; flex-direction: column; gap: 0.6rem; }
    .adm-qc:hover { border-color: var(--adm-primary); transform: translateY(-2px); }
    .adm-qc-icon { font-size: 1.6rem; }
    .adm-qc h3 { font-size: 0.95rem; font-weight: 600; }
    .adm-qc p { font-size: 0.78rem; color: var(--adm-text2); line-height: 1.5; }
    .adm-qc-arr { margin-top: auto; color: var(--adm-primary); font-size: 0.78rem; font-weight: 700; }

    /* User avatar circle */
    .u-av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,var(--adm-primary),var(--adm-accent)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.72rem; color: #000; flex-shrink: 0; }
  </style>
</head>
<body>
<header id="nav"></header>

<!-- Auth Gate -->
<div class="adm-gate" id="auth-gate">
  <div class="adm-gate-box">
    <img src="/public/logo2.png" onerror="this.style.display='none'">
    <h2>Admin Access</h2>
    <p id="auth-msg">Verifying session…</p>
    <div id="auth-loading"><div class="adm-spin"></div></div>
    <div id="auth-form" style="display:none">
      <div class="fg" style="text-align:left"><label>Admin Code</label>
        <input type="password" id="code-input" placeholder="Enter secret code" onkeydown="if(event.key==='Enter')verifyCode()" style="background:var(--adm-surface);border:1px solid var(--adm-border);border-radius:7px;padding:0.65rem 0.85rem;color:var(--adm-text);font-size:0.875rem;outline:none;width:100%;transition:border-color 0.15s">
      </div>
      <button class="adm-btn adm-btn-p adm-btn-full" onclick="verifyCode()" style="margin-top:0.25rem">Continue →</button>
      <p id="code-err" style="color:var(--adm-danger);font-size:0.8rem;margin-top:0.5rem"></p>
    </div>
    <div id="auth-gate-actions" style="display:none;margin-top:1rem">
      <button onclick="adminSignOut()" class="adm-btn adm-btn-d" style="width:100%;justify-content:center;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:0.4rem"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </div>
</div>

<!-- Admin Shell (hidden until auth) -->
<div id="adm-shell" style="display:none">
  <div class="adm-layout">
    <aside class="adm-sidebar">
      <div class="adm-logo">
        <img src="/public/logo2.png" onerror="this.style.display='none'">
        <span class="adm-logo-text">Admin Panel</span>
      </div>
      <nav class="adm-nav" id="adm-nav">
        <div class="adm-nav-section">Overview</div>
        <a href="#" class="active" data-tab="dashboard" onclick="nav(this)">⊞ &nbsp;Dashboard</a>
        <a href="#" data-tab="analytics" onclick="nav(this)">📊 &nbsp;Analytics</a>
        <div class="adm-nav-section">Catalog</div>
        <a href="#" data-tab="products" onclick="nav(this)">📦 &nbsp;Products</a>
        <a href="#" data-tab="categories" onclick="nav(this)">🏷️ &nbsp;Categories</a>
        <a href="#" data-tab="promos" onclick="nav(this)">🎟️ &nbsp;Promos</a>
        <div class="adm-nav-section">Manage</div>
        <a href="#" data-tab="orders" onclick="nav(this)">🚚 &nbsp;Orders</a>
        <a href="#" data-tab="users" onclick="nav(this)">👥 &nbsp;Users</a>
        <a href="#" data-tab="refunds" onclick="nav(this)">↩️ &nbsp;Refunds</a>
        <a href="#" data-tab="admins" onclick="nav(this)">🔑 &nbsp;Admin Users</a>
      </nav>
      <div class="adm-sidebar-footer">
        <div style="margin-bottom:0.3rem;font-size:0.72rem">Signed in as</div>
        <div id="sb-email" style="color:var(--adm-text);font-weight:600;font-size:0.8rem;word-break:break-all"></div>
        <button onclick="adminSignOut()" style="display:inline-flex;align-items:center;gap:0.4rem;margin-top:0.75rem;background:rgba(255,77,77,0.12);border:1px solid rgba(255,77,77,0.25);color:#ff6b6b;border-radius:6px;padding:0.45rem 0.9rem;cursor:pointer;font-size:0.78rem;font-weight:600;width:100%;justify-content:center;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>
    <div class="adm-main">
      <div class="adm-topbar">
        <div class="adm-breadcrumb">Admin / <span id="topbar-lbl">Dashboard</span></div>
        <div class="adm-user-badge">
          <div class="adm-avatar" id="top-avatar">A</div>
          <span id="top-name">Admin</span>
        </div>
      </div>
      <div class="adm-content" id="adm-content">
        <div class="adm-spin"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="adm-toast" id="adm-toast"></div>

<!-- Confirm -->
<div class="adm-co" id="adm-confirm">
  <div class="adm-cb">
    <h3 id="cfm-title">Are you sure?</h3>
    <p id="cfm-msg">This cannot be undone.</p>
    <div class="adm-ca">
      <button class="adm-btn adm-btn-o" onclick="cfmClose()">Cancel</button>
      <button class="adm-btn adm-btn-d" id="cfm-ok">Confirm</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
<script type="module">
  import { onAuthChange, supaAuth } from '/src/auth.js'
  import { listProducts, insertProduct, updateProduct, deleteProduct } from '/src/products.js'
  import { uploadFile } from '/src/upload.js'
  import { createClient } from '@supabase/supabase-js'

  const ADMIN_CODE  = 'laginard54'
  const supa = createClient(
    'https://tyhocgrjwxswxzzfvwct.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5aG9jZ3Jqd3hzd3h6emZ2d2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1Mjc2MzcsImV4cCI6MjA4MzEwMzYzN30.UqmldkZ-MYBoeDJYKCOPgWi9-06S5w1-w4g-7qAUZKE'
  )

  let currentUser = null
  let allProducts = [], allCats = [], allOrders = [], allUsers = []

  // ── Sign Out ──
  window.adminSignOut = async () => {
    await supa.auth.signOut()
    location.replace('/login.html')
  }

  // ── Toast ──
  window.toast = (msg, type='info') => {
    const el = document.getElementById('adm-toast')
    el.textContent = msg; el.className = `adm-toast ${type} show`
    setTimeout(() => el.classList.remove('show'), 3000)
  }

  // ── Confirm ──
  let cfmResolve = null
  window.cfmClose = () => { document.getElementById('adm-confirm').classList.remove('open'); cfmResolve?.(false) }
  document.getElementById('cfm-ok').onclick = () => { document.getElementById('adm-confirm').classList.remove('open'); cfmResolve?.(true) }
  function confirm2(title, msg, okTxt='Confirm') {
    document.getElementById('cfm-title').textContent = title
    document.getElementById('cfm-msg').textContent = msg
    document.getElementById('cfm-ok').textContent = okTxt
    document.getElementById('adm-confirm').classList.add('open')
    return new Promise(r => cfmResolve = r)
  }

  // ── Auth — checks is_admin column with email fallback ──
  const ADMIN_EMAIL = 'akosibbear38@gmail.com'

  onAuthChange(async (user) => {
    document.getElementById('auth-loading').style.display = 'none'
    if (!user) {
      document.getElementById('auth-msg').innerHTML =
        'Please <a href="/login.html" style="color:var(--adm-primary)">log in</a> to access the admin panel.'
      return
    }
    // Check is_admin flag — fall back to hardcoded email if column doesn't exist yet
    const { data: prof } = await supa.from('profiles').select('is_admin, email').eq('id', user.id).single()
    const isAdmin = prof?.is_admin === true || user.email === ADMIN_EMAIL
    if (!isAdmin) {
      document.getElementById('auth-msg').innerHTML =
        `<span style="color:#f87171">Access denied.</span><br>
         <small style="color:#8888a8">Your account does not have admin privileges.</small>`
      document.getElementById('auth-gate-actions').style.display = 'block'
      return
    }
    currentUser = user
    document.getElementById('auth-msg').textContent = `Welcome back, ${user.email.split('@')[0]}. Enter your admin code:`
    document.getElementById('auth-form').style.display = 'block'
    document.getElementById('code-input').focus()
  })

  window.verifyCode = () => {
    if (document.getElementById('code-input').value === ADMIN_CODE) {
      document.getElementById('auth-gate').style.display = 'none'
      document.getElementById('adm-shell').style.display = 'block'
      document.getElementById('sb-email').textContent = currentUser.email
      document.getElementById('top-avatar').textContent = currentUser.email[0].toUpperCase()
      document.getElementById('top-name').textContent = currentUser.email.split('@')[0]
      loadTab('dashboard')
    } else {
      document.getElementById('code-err').textContent = 'Incorrect code.'
    }
  }

  // ── Nav ──
  window.nav = (el) => {
    document.querySelectorAll('.adm-nav a').forEach(a => a.classList.remove('active'))
    el.classList.add('active')
    const tab = el.dataset.tab
    document.getElementById('topbar-lbl').textContent = el.textContent.trim().replace(/^.\s*/,'')
    loadTab(tab)
    return false
  }

  window.goTab = (tab) => {
    const link = document.querySelector(`.adm-nav a[data-tab="${tab}"]`)
    if (link) nav(link)
  }

  function loadTab(tab) {
    const c = document.getElementById('adm-content')
    c.innerHTML = '<div class="adm-spin"></div>'
    const fns = { dashboard: renderDashboard, analytics: renderAnalytics, products: renderProducts, categories: renderCategories, promos: renderPromos, orders: renderOrders, users: renderUsers, refunds: renderRefunds, admins: renderAdmins }
    fns[tab]?.()
  }

  // ════════════════════════════════════
  // ANALYTICS
  // ════════════════════════════════════
  async function renderAnalytics() {
    const now = new Date()
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString()
    const startOfYear  = new Date(now.getFullYear(), 0, 1).toISOString()

    const [
      { data: allOrders },
      { data: monthOrders },
      { data: topProducts },
      { data: recentPaid }
    ] = await Promise.all([
      supa.from('orders').select('total_cents,status,created_at,payment_method').order('created_at'),
      supa.from('orders').select('total_cents,status,created_at').gte('created_at', startOfMonth),
      supa.from('order_items').select('product_name,product_img,qty,price_cents').order('qty',{ascending:false}).limit(100),
      supa.from('orders').select('total_cents,created_at,payment_method').eq('status','paid').gte('created_at',startOfYear).order('created_at')
    ])

    const totalRev   = allOrders?.filter(o=>o.status==='paid').reduce((s,o)=>s+o.total_cents,0)||0
    const monthRev   = monthOrders?.filter(o=>o.status==='paid').reduce((s,o)=>s+o.total_cents,0)||0
    const totalOrders = allOrders?.length||0
    const paidOrders  = allOrders?.filter(o=>o.status==='paid').length||0
    const pendingOrders = allOrders?.filter(o=>o.status==='pending'||o.status==='processing').length||0
    const cancelledOrders = allOrders?.filter(o=>o.status==='cancelled').length||0

    // Monthly revenue for chart (last 6 months)
    const months6 = []
    for (let i=5;i>=0;i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1)
      months6.push({ label: d.toLocaleDateString('en-PH',{month:'short',year:'2-digit'}), month: d.getMonth(), year: d.getFullYear(), rev: 0, count: 0 })
    }
    allOrders?.filter(o=>o.status==='paid').forEach(o => {
      const d = new Date(o.created_at)
      const slot = months6.find(m=>m.month===d.getMonth()&&m.year===d.getFullYear())
      if (slot) { slot.rev += o.total_cents; slot.count++ }
    })
    const maxRev = Math.max(...months6.map(m=>m.rev), 1)

    // Payment method breakdown
    const payMap = {}
    allOrders?.filter(o=>o.status==='paid').forEach(o => { payMap[o.payment_method]=(payMap[o.payment_method]||0)+1 })
    const payTotal = Object.values(payMap).reduce((a,b)=>a+b,0)||1
    const payColors = { gcash:'#0071ce', maya:'#00a050', card:'#77cfcf', cod:'#f5a623' }
    const payLabels = { gcash:'GCash', maya:'Maya', card:'Card', cod:'COD' }

    // Top products by qty sold
    const prodMap = {}
    topProducts?.forEach(i => {
      const k = i.product_name||'Unknown'
      if (!prodMap[k]) prodMap[k] = { name:k, img:i.product_img, qty:0, rev:0 }
      prodMap[k].qty += i.qty
      prodMap[k].rev += i.price_cents * i.qty
    })
    const topList = Object.values(prodMap).sort((a,b)=>b.qty-a.qty).slice(0,6)

    set(`
      <style>
        .an-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1rem; margin-bottom:1.75rem; }
        .an-stat { background:var(--adm-card); border:1px solid var(--adm-border); border-radius:10px; padding:1.1rem 1.25rem; }
        .an-stat-val { font-size:1.4rem; font-weight:800; line-height:1; color:var(--adm-text); }
        .an-stat-lbl { font-size:0.73rem; color:var(--adm-text2); margin-top:0.3rem; text-transform:uppercase; letter-spacing:0.06em; }
        .an-stat-sub { font-size:0.78rem; color:var(--adm-primary); margin-top:0.2rem; font-weight:600; }
        .an-section { background:var(--adm-card); border:1px solid var(--adm-border); border-radius:10px; padding:1.25rem; margin-bottom:1.25rem; }
        .an-section h4 { font-size:0.88rem; font-weight:700; color:var(--adm-text); margin-bottom:1rem; }
        .bar-row { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.6rem; }
        .bar-label { font-size:0.76rem; color:var(--adm-text2); width:60px; text-align:right; flex-shrink:0; }
        .bar-track { flex:1; height:28px; background:rgba(119,207,207,0.06); border-radius:6px; overflow:hidden; position:relative; }
        .bar-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--adm-primary),#5ab5b5); transition:width 0.6s ease; display:flex; align-items:center; padding-left:0.5rem; }
        .bar-val { font-size:0.72rem; font-weight:700; color:#000; white-space:nowrap; }
        .pay-pie { display:flex; flex-wrap:wrap; gap:0.75rem; }
        .pay-slice { display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; }
        .pay-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .top-prod-row { display:flex; align-items:center; gap:0.75rem; padding:0.55rem 0; border-bottom:1px solid var(--adm-border); }
        .top-prod-row:last-child { border-bottom:none; }
        .top-prod-row img { width:36px; height:36px; object-fit:cover; border-radius:6px; border:1px solid var(--adm-border); }
        .an-two { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
        @media(max-width:700px){ .an-two { grid-template-columns:1fr; } }
      </style>
      <div class="adm-ph"><div><div class="adm-ph-title">Analytics</div><div class="adm-ph-sub">Revenue and sales overview</div></div></div>

      <div class="an-grid">
        <div class="an-stat">
          <div class="an-stat-val">&#8369;${(totalRev/100).toLocaleString('en-PH',{maximumFractionDigits:0})}</div>
          <div class="an-stat-lbl">Total Revenue</div>
          <div class="an-stat-sub">All-time paid</div>
        </div>
        <div class="an-stat">
          <div class="an-stat-val">&#8369;${(monthRev/100).toLocaleString('en-PH',{maximumFractionDigits:0})}</div>
          <div class="an-stat-lbl">This Month</div>
          <div class="an-stat-sub">${monthOrders?.filter(o=>o.status==='paid').length||0} orders</div>
        </div>
        <div class="an-stat">
          <div class="an-stat-val">${totalOrders}</div>
          <div class="an-stat-lbl">Total Orders</div>
          <div class="an-stat-sub">${paidOrders} paid</div>
        </div>
        <div class="an-stat">
          <div class="an-stat-val">${pendingOrders}</div>
          <div class="an-stat-lbl">Pending / Processing</div>
          <div class="an-stat-sub">${cancelledOrders} cancelled</div>
        </div>
        <div class="an-stat">
          <div class="an-stat-val">${paidOrders > 0 ? '&#8369;'+(totalRev/paidOrders/100).toFixed(0) : '—'}</div>
          <div class="an-stat-lbl">Avg. Order Value</div>
          <div class="an-stat-sub">Paid orders only</div>
        </div>
      </div>

      <!-- Revenue Chart -->
      <div class="an-section">
        <h4>📈 Monthly Revenue — Last 6 Months</h4>
        ${months6.map(m=>`
          <div class="bar-row">
            <div class="bar-label">${m.label}</div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${maxRev>0?Math.max(3,(m.rev/maxRev*100)).toFixed(1):0}%">
                ${m.rev>0?`<span class="bar-val">&#8369;${(m.rev/100).toLocaleString('en-PH',{maximumFractionDigits:0})}</span>`:''}
              </div>
            </div>
            <div style="font-size:0.72rem;color:var(--adm-text2);min-width:40px;text-align:right;">${m.count} orders</div>
          </div>`).join('')}
      </div>

      <div class="an-two">
        <!-- Payment Method Breakdown -->
        <div class="an-section">
          <h4>💳 Payment Methods</h4>
          ${Object.keys(payMap).length ? `
            ${Object.entries(payMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
              <div class="bar-row" style="margin-bottom:0.5rem;">
                <div class="bar-label" style="width:50px;font-size:0.74rem;">${payLabels[k]||k}</div>
                <div class="bar-track" style="height:22px;">
                  <div class="bar-fill" style="width:${(v/payTotal*100).toFixed(1)}%;background:${payColors[k]||'var(--adm-primary)'};">
                    <span class="bar-val">${v} (${(v/payTotal*100).toFixed(0)}%)</span>
                  </div>
                </div>
              </div>`).join('')}
          ` : '<p style="color:var(--adm-text2);font-size:0.85rem;">No paid orders yet.</p>'}
        </div>

        <!-- Order Status Breakdown -->
        <div class="an-section">
          <h4>📦 Order Status Breakdown</h4>
          ${[['paid','#2ecc71'],['pending','#f5a623'],['processing','#60a5fa'],['shipped','#a78bfa'],['delivered','#4ade80'],['cancelled','#f87171']].map(([st,color])=>{
            const count = allOrders?.filter(o=>o.status===st).length||0
            if (!count) return ''
            return `<div class="bar-row" style="margin-bottom:0.5rem;">
              <div class="bar-label" style="width:70px;font-size:0.73rem;text-transform:capitalize;">${st}</div>
              <div class="bar-track" style="height:22px;">
                <div class="bar-fill" style="width:${(count/totalOrders*100).toFixed(1)}%;background:${color};">
                  <span class="bar-val">${count}</span>
                </div>
              </div>
            </div>`
          }).join('')}
        </div>
      </div>

      <!-- Top Products -->
      <div class="an-section">
        <h4>🏆 Top Products by Units Sold</h4>
        ${topList.length ? topList.map((p,i)=>`
          <div class="top-prod-row">
            <div style="color:var(--adm-text2);font-size:0.8rem;font-weight:700;min-width:20px;">#${i+1}</div>

            <div style="flex:1;">
              <div style="font-weight:600;font-size:0.85rem;color:var(--adm-text);">${escHtmlAdm(p.name)}</div>
              <div style="font-size:0.73rem;color:var(--adm-text2);">&#8369;${(p.rev/100).toFixed(2)} revenue</div>
            </div>
            <div style="font-weight:700;font-size:0.9rem;color:var(--adm-primary);">${p.qty} sold</div>
          </div>`).join('')
        : '<p style="color:var(--adm-text2);font-size:0.85rem;">No sales data yet.</p>'}
      </div>
    `)
  }

  function escHtmlAdm(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  async function renderProducts() {
    const [{ data: prods }, { data: cats }] = await Promise.all([
      supa.from('products').select('*, categories(name)').order('created_at',{ascending:false}),
      supa.from('categories').select('*').order('name')
    ])
    allProducts = prods||[]; allCats = cats||[]

    set(`
      <div class="adm-ph">
        <div><div class="adm-ph-title">Products</div><div class="adm-ph-sub">${allProducts.length} items in catalog</div></div>
        <button class="adm-btn adm-btn-p" onclick="openProdModal()">+ Add Product</button>
      </div>
      <div class="adm-toolbar">
        <div class="adm-search">
          ${searchIco()}
          <input type="text" placeholder="Search products…" id="ps-q" oninput="fprod()">
        </div>
        <select class="adm-sel" id="ps-cat" onchange="fprod()">
          <option value="">All Categories</option>
          ${allCats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>
      <div class="adm-tw" id="prod-tw">${prodTable(allProducts)}</div>
      ${prodModal()}
    `)
  }

  function prodTable(prods) {
    if (!prods.length) return `<div class="adm-empty">No products found</div>`
    return `<table class="adm-t"><thead><tr><th>Img</th><th>Name</th><th>Price</th><th>Stock</th><th>Category</th><th>SKU</th><th>Actions</th></tr></thead>
    <tbody>${prods.map(p=>`<tr>
      <td><img src="${p.img_url||'/public/product.png'}" onerror="this.src='/public/product.png'"></td>
      <td><div style="font-weight:600">${p.name}</div><div style="font-size:0.73rem;color:var(--adm-text2)">${p.slug}</div></td>
      <td>₱${(p.price_cents/100).toFixed(2)}</td>
      <td>${p.stock<=5?`<span class="b b-r">${p.stock}</span>`:`<span class="b b-g">${p.stock}</span>`}</td>
      <td><span class="b b-t">${p.categories?.name||'—'}</span></td>
      <td style="font-size:0.75rem;color:var(--adm-text2)">${p.sku||'—'}</td>
      <td><div style="display:flex;gap:0.4rem">
        <button class="adm-btn adm-btn-o adm-btn-s" onclick='openProdModal(${esc(p)})'>Edit</button>
        <button class="adm-btn adm-btn-d adm-btn-s" onclick="delProd('${p.id}','${p.name.replace(/'/g,"\\'")}')">Del</button>
      </div></td>
    </tr>`).join('')}</tbody></table>`
  }

  window.fprod = () => {
    const q = document.getElementById('ps-q')?.value.toLowerCase()||''
    const cat = document.getElementById('ps-cat')?.value||''
    let f = allProducts
    if (q) f = f.filter(p=>p.name.toLowerCase().includes(q)||p.slug.includes(q)||p.sku?.includes(q))
    if (cat) f = f.filter(p=>p.category_id===cat)
    document.getElementById('prod-tw').innerHTML = prodTable(f)
  }

  function prodModal() {
    return `<div class="adm-mo" id="prod-mo">
      <div class="adm-mb">
        <div class="adm-mh"><div class="adm-mt" id="pm-title">Add Product</div><button class="adm-mx" onclick="closeMo('prod-mo')">✕</button></div>
        <input type="hidden" id="pm-id">
        <div class="fr">
          <div class="fg"><label>Name *</label><input id="pm-name" placeholder="Arduino UNO R3" oninput="aSlug()"></div>
          <div class="fg"><label>Slug *</label><input id="pm-slug" placeholder="arduino-uno-r3"></div>
        </div>
        <div class="fr">
          <div class="fg"><label>Price (PHP) *</label><input id="pm-price" type="number" step="0.01" placeholder="1500.00"></div>
          <div class="fg"><label>Stock *</label><input id="pm-stock" type="number" placeholder="25"></div>
        </div>
        <div class="fr">
          <div class="fg"><label>Category</label><select id="pm-cat"><option value="">Select…</option>${allCats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
          <div class="fg"><label>SKU</label><input id="pm-sku" placeholder="ARD-001"></div>
        </div>
        <div class="fg"><label>Description</label><textarea id="pm-desc" placeholder="Product description…"></textarea></div>
        <div class="fg"><label>Image <small style="text-transform:none;font-weight:400;color:var(--adm-text2)">(JPG/PNG/WEBP)</small></label><input id="pm-img" type="file" accept="image/*"></div>
        <div id="pm-status" style="font-size:0.8rem;color:var(--adm-text2);margin-bottom:0.5rem"></div>
        <div class="adm-mf">
          <button class="adm-btn adm-btn-o" onclick="closeMo('prod-mo')">Cancel</button>
          <button class="adm-btn adm-btn-p" onclick="saveProd()">Save Product</button>
        </div>
      </div>
    </div>`
  }

  window.openProdModal = (jsonStr) => {
    const p = jsonStr ? JSON.parse(jsonStr) : null
    document.getElementById('pm-title').textContent = p ? 'Edit Product' : 'Add Product'
    document.getElementById('pm-id').value = p?.id||''
    document.getElementById('pm-name').value = p?.name||''
    document.getElementById('pm-slug').value = p?.slug||''
    document.getElementById('pm-price').value = p ? (p.price_cents/100).toFixed(2) : ''
    document.getElementById('pm-stock').value = p?.stock??''
    document.getElementById('pm-cat').value = p?.category_id||''
    document.getElementById('pm-sku').value = p?.sku||''
    document.getElementById('pm-desc').value = p?.description||''
    document.getElementById('pm-status').textContent = ''
    document.getElementById('prod-mo').classList.add('open')
  }

  window.aSlug = () => {
    const v = document.getElementById('pm-name').value
    document.getElementById('pm-slug').value = v.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').substring(0,50)
  }

  window.saveProd = async () => {
    const id = document.getElementById('pm-id').value
    const name = document.getElementById('pm-name').value.trim()
    const slug = document.getElementById('pm-slug').value.trim()
    const price = parseFloat(document.getElementById('pm-price').value)
    const stock = parseInt(document.getElementById('pm-stock').value)
    if (!name||!slug||!price||isNaN(stock)) { toast('Fill all required fields','error'); return }

    const st = document.getElementById('pm-status')
    const imgFile = document.getElementById('pm-img').files[0]
    let img_url = id ? allProducts.find(p=>p.id===id)?.img_url : null

    if (imgFile) {
      st.textContent = 'Uploading image…'
      const r = await uploadFile(imgFile)
      if (r.error) { toast('Image upload failed','error'); st.textContent=''; return }
      img_url = r.url
    }

    st.textContent = 'Saving…'
    const payload = { name, slug, price_cents: Math.round(price*100), stock, category_id: document.getElementById('pm-cat').value||null, sku: document.getElementById('pm-sku').value.trim()||null, description: document.getElementById('pm-desc').value.trim()||null, img_url }

    const { error } = id ? await updateProduct(id, payload) : await insertProduct(payload)
    if (error) { toast(error.message,'error'); st.textContent=''; return }
    toast(id ? 'Product updated!' : 'Product added!','success')
    closeMo('prod-mo')
    renderProducts()
  }

  window.delProd = async (id, name) => {
    if (!await confirm2('Delete Product', `Delete "${name}"? Cannot be undone.`, 'Delete')) return
    const { error } = await deleteProduct(id)
    if (error) { toast(error.message,'error'); return }
    toast('Product deleted','info')
    renderProducts()
  }

  window.saveCat = async () => {
    const id = document.getElementById('cm-id').value
    const name = document.getElementById('cm-name').value.trim()
    const slug = document.getElementById('cm-slug').value.trim() || name.toLowerCase().replace(/\s+/g,'-')
    if (!name) { toast('Name required','error'); return }
    const { error } = id ? await supa.from('categories').update({name,slug}).eq('id',id) : await supa.from('categories').insert({name,slug})
    if (error) { toast(error.message,'error'); return }
    toast(id ? 'Category updated' : 'Category added','success')
    closeMo('cat-mo'); renderCategories()
  }

  window.delCat = async (id, name) => {
    if (!await confirm2('Delete Category', `Delete "${name}"?`, 'Delete')) return
    const { error } = await supa.from('categories').delete().eq('id',id)
    if (error) { toast(error.message,'error'); return }
    toast('Deleted','info'); renderCategories()
  }

  window.openPromoMo = (jsonStr) => {
    const p = jsonStr ? JSON.parse(jsonStr) : null
    document.getElementById('pmo-title').textContent = p ? 'Edit Promo' : 'Add Promo'
    document.getElementById('pmo-id').value = p?.id||''
    document.getElementById('pmo-code').value = p?.code||''
    document.getElementById('pmo-disc').value = p?.discount_percent||''
    document.getElementById('pmo-min').value = p ? p.min_order_cents/100 : ''
    document.getElementById('pmo-max').value = p?.max_uses||''
    document.getElementById('pmo-from').value = p?.valid_from?.substring(0,16)||''
    document.getElementById('pmo-until').value = p?.valid_until?.substring(0,16)||''
    document.getElementById('pmo-desc').value = p?.description||''
    document.getElementById('pmo-ship').checked = p?.is_free_shipping||false
    document.getElementById('promo-mo').classList.add('open')
  }

  window.savePromo = async () => {
    const id    = document.getElementById('pmo-id').value
    const code  = document.getElementById('pmo-code').value.trim().toUpperCase()
    const disc  = parseInt(document.getElementById('pmo-disc').value)||0
    const min   = parseFloat(document.getElementById('pmo-min').value)||0
    const maxU  = document.getElementById('pmo-max').value
    const until = document.getElementById('pmo-until').value
    const from  = document.getElementById('pmo-from').value
    const desc  = document.getElementById('pmo-desc').value.trim()
    const ship  = document.getElementById('pmo-ship').checked
    if (!code||!until) { toast('Code and expiry required','error'); return }
    const payload = { code, discount_percent: disc, min_order_cents: Math.round(min*100), valid_from: from||new Date().toISOString(), valid_until: new Date(until).toISOString(), description: desc||null, is_free_shipping: ship, max_uses: maxU ? parseInt(maxU) : null }
    const { error } = id ? await supa.from('promos').update(payload).eq('id',id) : await supa.from('promos').insert(payload)
    if (error) { toast(error.message,'error'); return }
    toast(id ? 'Promo updated!' : 'Promo created!','success')
    closeMo('promo-mo'); renderPromos()
  }

  window.delPromo = async (id, code) => {
    if (!await confirm2('Delete Promo', `Delete code "${code}"?`, 'Delete')) return
    await supa.from('promos').delete().eq('id',id)
    toast('Deleted','info'); renderPromos()
  }

  window.openNotifMo = () => document.getElementById('notif-mo').classList.add('open')

  window.sendNotif = async () => {
    const title  = document.getElementById('nmo-title').value.trim()
    const msg    = document.getElementById('nmo-msg').value.trim()
    const target = document.getElementById('nmo-target').value
    const st     = document.getElementById('nmo-status')
    if (!title||!msg) { toast('Title and message required','error'); return }
    st.textContent = 'Fetching users…'
    let ids = []
    if (target==='all') { const {data}=await supa.from('profiles').select('id'); ids=data?.map(p=>p.id)||[] }
    else if (target==='wishlist') { const {data}=await supa.from('wishlists').select('user_id'); ids=[...new Set(data?.map(w=>w.user_id)||[])] }
    else { const {data}=await supa.from('cart_items').select('user_id'); ids=[...new Set(data?.map(c=>c.user_id)||[])] }
    st.textContent = `Sending to ${ids.length} users…`
    if (ids.length) {
      const { error } = await supa.from('notifications').insert(ids.map(uid=>({ user_id:uid, title, message:msg, type:'promo', is_read:false })))
      if (error) { toast(error.message,'error'); st.textContent=''; return }
    }
    toast(`Sent to ${ids.length} users!`,'success')
    st.textContent = ''; closeMo('notif-mo')
  }

    return `<table class="adm-t"><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Payment</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>

  window.ford = () => {
    const q = document.getElementById('os-q')?.value.toLowerCase()||''
    const s = document.getElementById('os-status')?.value||''
    const p = document.getElementById('os-pay')?.value||''
    let f = allOrders

    document.getElementById('orders-tw').innerHTML = orderTable(f)

    const t = document.getElementById('us-terms')?.value||''
    let f = allUsers
    if (q) f = f.filter(u=>(u.email||'').toLowerCase().includes(q)||(u.first_name||'').toLowerCase().includes(q)||(u.last_name||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q))
    if (t==='yes') f = f.filter(u=>u.terms_accepted)
    else if (t==='no') f = f.filter(u=>!u.terms_accepted)
    document.getElementById('users-tw').innerHTML = usersTable(f)
  }

  window.openUserMo = (jsonStr) => {
    const u = JSON.parse(jsonStr)
    document.getElementById('um-id').value = u.id
    document.getElementById('um-first').value = u.first_name||''
    document.getElementById('um-last').value = u.last_name||''
    document.getElementById('um-user').value = u.username||''
    document.getElementById('um-email').value = u.email||''
    document.getElementById('um-contact').value = u.contact_number||''
    document.getElementById('um-addr').value = u.address||''
    document.getElementById('um-terms').checked = u.terms_accepted||false
    document.getElementById('user-mo').classList.add('open')
  }

  window.saveUser = async () => {
    const id = document.getElementById('um-id').value
    const { error } = await supa.from('profiles').update({
      first_name: document.getElementById('um-first').value.trim()||null,
      last_name:  document.getElementById('um-last').value.trim()||null,
      username:   document.getElementById('um-user').value.trim()||null,
      contact_number: document.getElementById('um-contact').value.trim()||null,
      address:    document.getElementById('um-addr').value.trim()||null,
      terms_accepted: document.getElementById('um-terms').checked
    }).eq('id',id)
    if (error) { toast(error.message,'error'); return }
    toast('User updated!','success')
    closeMo('user-mo'); renderUsers()
  }

  window.openUserNotifMo = () => {
    const email = document.getElementById('um-email').value
    document.getElementById('un-target-info').textContent = `Sending to: ${email}`
    document.getElementById('user-notif-mo').classList.add('open')
  }

  window.sendUserNotif = async () => {
    const userId = document.getElementById('um-id').value
    const title  = document.getElementById('un-title').value.trim()
    const msg    = document.getElementById('un-msg').value.trim()
    if (!title||!msg) { toast('Fill in title and message','error'); return }
    const { error } = await supa.from('notifications').insert({ user_id:userId, title, message:msg, type:'system', is_read:false })
    if (error) { toast(error.message,'error'); return }
    toast('Notification sent!','success')
    closeMo('user-notif-mo')
  }

  window.removeUser = async (id, email) => {
    if (!await confirm2('Remove User Profile', `Remove profile data for "${email}"? Only deletes profile data, not auth account.`, 'Remove')) return
    const { error } = await supa.from('profiles').delete().eq('id',id)
    if (error) { toast(error.message,'error'); return }
    toast('Profile removed','info'); renderUsers()
  }

  // ════════════════════════════════════
  // REFUNDS
  // ════════════════════════════════════
  async function renderRefunds() {
    const { data: refunds } = await supa.from('refund_requests').select('*').order('created_at',{ascending:false})
    // Fetch user profiles for the refunds
    if (refunds?.length) {
      const userIds = [...new Set(refunds.map(r=>r.user_id).filter(Boolean))]
      if (userIds.length) {
        const { data: profiles } = await supa.from('profiles').select('id,email,first_name,last_name').in('id', userIds)
        const profileMap = {}
        profiles?.forEach(p=>profileMap[p.id]=p)
        refunds.forEach(r=>r.profiles=profileMap[r.user_id]||{})
      }
    }
    set(`
      <div class="adm-ph">
        <div><div class="adm-ph-title">Refund Requests</div><div class="adm-ph-sub">${refunds?.length||0} requests</div></div>
      </div>
      <div class="adm-tw">
        <table class="adm-t"><thead><tr><th>ID</th><th>Customer</th><th>Order</th><th>Reason</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody>${refunds?.map(r=>`<tr>
          <td style="font-family:monospace;font-size:0.76rem">#${r.id.substring(0,8).toUpperCase()}</td>
          <td><div style="font-weight:500">${r.profiles?.first_name||'—'} ${r.profiles?.last_name||''}</div><div style="font-size:0.73rem;color:var(--adm-text2)">${r.profiles?.email||'—'}</div></td>
          <td style="font-family:monospace;font-size:0.76rem">#${(r.order_id||'').substring(0,8).toUpperCase()}</td>
          <td style="max-width:180px;color:var(--adm-text2);font-size:0.8rem">${r.reason||'—'}</td>
          <td>${r.status==='approved'?`<span class="b b-g">Approved</span>`:r.status==='rejected'?`<span class="b b-r">Rejected</span>`:`<span class="b b-o">Pending</span>`}</td>
          <td style="color:var(--adm-text2);font-size:0.78rem">${new Date(r.created_at).toLocaleDateString('en-PH')}</td>
          <td><div style="display:flex;gap:0.4rem">
            <button class="adm-btn adm-btn-s" style="background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.25);color:#2ecc71" onclick="doRefund('${r.id}','approved')">Approve</button>
            <button class="adm-btn adm-btn-d adm-btn-s" onclick="doRefund('${r.id}','rejected')">Reject</button>
          </div></td>
        </tr>`).join('')||empty('No refund requests')}</tbody></table>
      </div>
    `)
  }

  window.doRefund = async (id, status) => {
    if (!await confirm2(`${status==='approved'?'Approve':'Reject'} Refund`, `Mark this refund as ${status}?`, status==='approved'?'Approve':'Reject')) return
    const { error } = await supa.from('refund_requests').update({status}).eq('id',id)
    if (error) { toast(error.message,'error'); return }
    toast(`Refund ${status}!`, status==='approved'?'success':'info')
    renderRefunds()
  }

  // ── Helpers ──
  function set(html) { document.getElementById('adm-content').innerHTML = html }
  window.closeMo = (id) => document.getElementById(id).classList.remove('open')
  function esc(obj) { return JSON.stringify(JSON.stringify(obj)) }
  function empty(msg) { return `<tr><td colspan="20" style="text-align:center;padding:2.5rem;color:var(--adm-text2)">${msg}</td></tr>` }
  function searchIco() { return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>` }
  function sbadge(s) {
    const m = { paid:'b-g', pending:'b-o', cancelled:'b-r', refunded:'b-t', shipped:'b-t', delivered:'b-g' }
    return `<span class="b ${m[s]||'b-gray'}">${s||'?'}</span>`
  }
  function ico(n) {
    const m = {
      box: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
      cart: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>`,
      users: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`,
      pct: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>`,
      peso: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="13" x2="21" y2="13"/><path d="M8 21V5a2 2 0 012-2h4a2 2 0 010 4H8"/></svg>`
    }
    return m[n]||''
  }

  // ════════════════════════════════════
  // ADMIN USERS
  // ════════════════════════════════════
  async function renderAdmins() {
    const { data: admins } = await supa
      .from('profiles')
      .select('id, email, first_name, last_name, username, created_at, is_admin')
      .eq('is_admin', true)
      .order('created_at')

    set(`
      <div class="adm-ph">
        <div>
          <div class="adm-ph-title">Admin Users</div>
          <div class="adm-ph-sub">Manage who has access to this admin panel</div>
        </div>
      </div>

      <!-- Grant access form -->
      <div style="background:var(--adm-card);border:1px solid var(--adm-border);border-radius:10px;padding:1.5rem;margin-bottom:1.5rem;">
        <div style="font-size:0.88rem;font-weight:700;color:var(--adm-text);margin-bottom:0.35rem;">Grant Admin Access</div>
        <div style="font-size:0.78rem;color:var(--adm-text2);margin-bottom:1rem;">
          The user must already have a registered account. Enter their email address to give them admin privileges.
          They will need the admin code <strong style="color:var(--adm-primary);font-family:monospace">laginard54</strong> to log in.
        </div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
          <input id="grant-email" type="email" placeholder="user@example.com"
            style="flex:1;min-width:220px;background:var(--adm-card);border:1px solid var(--adm-border);border-radius:8px;padding:0.6rem 0.9rem;color:var(--adm-text);font-size:0.85rem;outline:none;"
            onfocus="this.style.borderColor='var(--adm-primary)'" onblur="this.style.borderColor='var(--adm-border)'"
            onkeydown="if(event.key==='Enter')grantAdmin()">
          <button class="adm-btn adm-btn-p" onclick="grantAdmin()">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            Grant Access
          </button>
        </div>
        <div id="grant-result" style="margin-top:0.65rem;font-size:0.82rem;"></div>
      </div>

      <!-- Current admins table -->
      <div style="font-size:0.88rem;font-weight:700;color:var(--adm-text);margin-bottom:0.65rem;">Current Admins (${admins?.length || 0})</div>
      <div class="adm-tw">
        <table class="adm-t">
          <thead><tr><th>Name</th><th>Email</th><th>Username</th><th>Added</th><th>Action</th></tr></thead>
          <tbody>
            ${admins?.length ? admins.map(a => {
              const name = [a.first_name, a.last_name].filter(Boolean).join(' ') || '—'
              const isMe = a.id === currentUser.id
              return `<tr>
                <td style="font-weight:600">${escHtmlAdm(name)}</td>
                <td style="color:var(--adm-text2);font-size:0.82rem">${escHtmlAdm(a.email||'')}</td>
                <td style="color:var(--adm-text2);font-size:0.82rem">${escHtmlAdm(a.username||'—')}</td>
                <td style="color:var(--adm-text2);font-size:0.78rem">${new Date(a.created_at).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</td>
                <td>${isMe
                  ? `<span style="font-size:0.75rem;color:var(--adm-text2);font-style:italic">You</span>`
                  : `<button class="adm-btn adm-btn-d" style="padding:0.35rem 0.75rem;font-size:0.78rem" onclick="revokeAdmin('${a.id}','${escHtmlAdm(a.email||name)}')">Revoke</button>`
                }</td>
              </tr>`
            }).join('') : empty('No other admins yet')}
          </tbody>
        </table>
      </div>

      <div style="margin-top:1.5rem;background:rgba(245,166,35,0.06);border:1px solid rgba(245,166,35,0.2);border-radius:8px;padding:1rem 1.25rem;">
        <div style="font-size:0.8rem;color:var(--adm-warning);font-weight:700;margin-bottom:0.3rem;">⚠️ How admin registration works</div>
        <div style="font-size:0.78rem;color:var(--adm-text2);line-height:1.6;">
          1. The new admin must first <strong style="color:var(--adm-text)">sign up</strong> on the store with their email.<br>
          2. You grant them access here using their registered email.<br>
          3. They go to <strong style="color:var(--adm-primary)">/admin.html</strong> and log in with their email + password.<br>
          4. They enter the shared admin code: <strong style="color:var(--adm-primary);font-family:monospace">laginard54</strong><br>
          5. To change the admin code, update <code style="color:var(--adm-primary)">ADMIN_CODE</code> in admin.html.
        </div>
      </div>
    `)

    window.grantAdmin = async () => {
      const email = document.getElementById('grant-email').value.trim().toLowerCase()
      const result = document.getElementById('grant-result')
      if (!email || !email.includes('@')) {
        result.innerHTML = '<span style="color:#f87171">Please enter a valid email address.</span>'
        return
      }
      // Find the user in profiles by email
      const { data: matches } = await supa
        .from('profiles')
        .select('id, email, first_name, last_name, is_admin')
        .eq('email', email)
      if (!matches?.length) {
        result.innerHTML = '<span style="color:#f87171">No account found with that email. They need to sign up first.</span>'
        return
      }
      const target = matches[0]
      if (target.is_admin) {
        result.innerHTML = '<span style="color:var(--adm-primary)">This user is already an admin.</span>'
        return
      }
      const { error } = await supa.from('profiles').update({ is_admin: true }).eq('id', target.id)
      if (error) {
        result.innerHTML = `<span style="color:#f87171">Error: ${error.message}</span>`
        return
      }
      result.innerHTML = `<span style="color:#2ecc71">✓ Admin access granted to ${email}. They can now log in at /admin.html.</span>`
      document.getElementById('grant-email').value = ''
      setTimeout(() => renderAdmins(), 1500)
    }

    window.revokeAdmin = async (id, label) => {
      const ok = await confirm2('Revoke Admin Access', `Remove admin access for ${label}? They will no longer be able to log into the admin panel.`, 'Revoke')
      if (!ok) return
      const { error } = await supa.from('profiles').update({ is_admin: false }).eq('id', id)
      if (error) { toast('Error: ' + error.message, 'error'); return }
      toast(`Admin access revoked for ${label}`, 'success')
      renderAdmins()
    }
  }
</script>
</body>
</html>
