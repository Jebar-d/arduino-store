<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>Add product</h1>
    <form id="form">
      <input name="name" placeholder="Name" required><br>
      <input name="slug" placeholder="slug-url" required><br>
      <input name="price" type="number" step="0.01" placeholder="price USD" required><br>
      <input name="stock" type="number" placeholder="stock" required><br>
      <textarea name="desc" placeholder="description"></textarea><br>
      <input id="img" type="file" accept="image/*" required><br>
      <input id="model" type="file" accept=".stl,.obj,.glb,.gltf"><br>
      <button>Add</button>
    </form>
  </main>
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    import { onAuthChange } from '/src/auth.js'
    import { insertProduct } from '/src/products.js'
    import { uploadFile } from '/src/upload.js'

    onAuthChange(u => {
      if (!u) location.href = '/login.html'
    })

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault()
      const f = e.target
      const imgFile = document.getElementById('img').files[0]
      const modelFile = document.getElementById('model').files[0]
      const [{ url: img }, { url: model }] = await Promise.all([
        uploadFile(imgFile),
        modelFile ? uploadFile(modelFile) : { url: null }
      ])
      const { data, error } = await insertProduct({
        name: f.name.value,
        slug: f.slug.value,
        price_cents: Math.round(Number(f.price.value) * 100),
        stock: Number(f.stock.value),
        description: f.desc.value,
        img_url: img,
        model_url: model
      })
      if (error) return alert(error.message)
      alert('Product added')
      f.reset()
    })
  </script>
</body>
</html>
