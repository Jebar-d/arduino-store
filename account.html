<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Account – Arduino Store</title>
  <link rel="icon" type="image/png" href="/public/logo2.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css"/>
  <style>
    .account-layout {
      display: grid; grid-template-columns: 240px 1fr;
      gap: 2rem; align-items: start;
      max-width: 1100px; margin: 0 auto; padding: 2rem 1rem;
    }
    @media (max-width: 768px) { .account-layout { grid-template-columns: 1fr; } }

    .account-sidebar {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
      position: sticky; top: 80px;
    }
    .account-user-card {
      padding: 1.5rem; text-align: center;
      background: linear-gradient(135deg, rgba(119,207,207,0.08), rgba(119,207,207,0.02));
      border-bottom: 1px solid var(--border);
    }
    .account-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.5rem; color: #000; margin: 0 auto 0.75rem;
    }
    .u-name  { font-weight: 700; font-size: 1rem; color: var(--text); }
    .u-email { color: var(--text2); font-size: 0.8rem; margin-top: 2px; }

    .account-nav { padding: 0.5rem 0; }
    .account-nav a {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1.25rem; color: var(--text2);
      text-decoration: none; font-size: 0.88rem; font-weight: 500;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    .account-nav a:hover  { background: rgba(119,207,207,0.06); color: var(--text); }
    .account-nav a.active { background: rgba(119,207,207,0.1); color: var(--primary); border-left-color: var(--primary); }
    .acct-nav-icon { display:flex; align-items:center; justify-content:center; width:18px; flex-shrink:0; }

    .account-main { min-height: 400px; }
    .account-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 1.25rem;
    }
    .account-card h3 {
      margin-bottom: 1.25rem; font-size: 1.05rem; color: var(--text);
      padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);
    }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .fg { display: flex; flex-direction: column; gap: 0.35rem; }
    .fg label { font-size: 0.82rem; color: var(--text2); font-weight: 600; }
    .fg input, .fg select, .fg textarea {
      padding: 0.65rem 0.9rem; background: var(--surface-light);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-size: 0.9rem; transition: border-color 0.15s; width: 100%;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: var(--primary); }
    .fg textarea { resize: vertical; min-height: 80px; }
    .fg input:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Purchase items */
    .purchase-item {
      display: flex; gap: 1rem; align-items: center; padding: 1rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 0.75rem; background: var(--surface-light); transition: border-color 0.15s;
    }
    .purchase-item:hover { border-color: rgba(119,207,207,0.3); }
    .purchase-item img { width:58px; height:58px; object-fit:contain; border-radius:6px; background:var(--surface); flex-shrink:0; }
    .p-info { flex: 1; }
    .p-name  { font-weight: 600; font-size: 0.9rem; color: var(--text); }
    .p-date  { color: var(--text2); font-size: 0.78rem; margin-top: 2px; }
    .p-badge { font-size: 0.72rem; font-weight:700; padding: 2px 8px; border-radius:10px; display:inline-block; }
    .p-badge.pending    { background:rgba(255,170,0,0.15);   color:var(--warning); }
    .p-badge.processing { background:rgba(59,130,246,0.15);  color:#60a5fa; }
    .p-badge.shipped    { background:rgba(59,130,246,0.15);  color:#60a5fa; }
    .p-badge.delivered  { background:rgba(74,222,128,0.15);  color:var(--success); }
    .p-badge.cancelled  { background:rgba(248,113,113,0.15); color:var(--error); }

    /* Voucher */
    .voucher-card {
      border: 1px dashed rgba(119,207,207,0.35); border-radius: var(--radius);
      padding: 1.1rem 1.25rem; display:flex; align-items:center; gap:1.25rem;
      background: rgba(119,207,207,0.03); margin-bottom: 0.75rem;
    }
    .voucher-pct { font-size:1.75rem; font-weight:900; color:var(--primary); min-width:56px; text-align:center; line-height:1; }
    .v-code   { font-family:'Courier New',monospace; font-weight:700; font-size:1rem; color:var(--primary); }
    .v-desc   { color:var(--text2); font-size:0.8rem; margin-top:1px; }
    .v-expiry { color:var(--warning); font-size:0.76rem; display:flex; align-items:center; gap:4px; margin-top:3px; }

    /* Password toggle */
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right: 2.5rem; }
    .pw-toggle {
      position:absolute; right:0.5rem; top:50%; transform:translateY(-50%);
      background:transparent; border:none; color:var(--text2);
      cursor:pointer; padding:4px; display:flex; align-items:center; border-radius:4px;
    }
    .pw-toggle:hover { color:var(--text); }

    /* Notification items */
    .notif-row {
      display:flex; gap:0.75rem; align-items:flex-start; padding:0.9rem 1rem;
      border-radius:var(--radius-sm); border:1px solid var(--border);
      margin-bottom:0.5rem; background:var(--surface-light);
    }
    .notif-row.unread { border-left:3px solid var(--primary); }
    .notif-ico  { color:var(--primary); display:flex; align-items:center; flex-shrink:0; padding-top:1px; }
    .notif-title{ font-weight:600; font-size:0.88rem; color:var(--text); }
    .notif-body { color:var(--text2); font-size:0.82rem; margin-top:2px; line-height:1.4; }
    .notif-time { color:var(--text2); font-size:0.72rem; margin-top:4px; }
    .unread-dot { width:8px; height:8px; border-radius:50%; background:#3b82f6; flex-shrink:0; margin-top:5px; }

    /* Address */
    .addr-card {
      background:rgba(119,207,207,0.04); border:1px dashed rgba(119,207,207,0.25);
      border-radius:var(--radius); padding:1.25rem; margin-bottom:1rem;
    }
    .addr-default { display:inline-block; background:rgba(119,207,207,0.15); color:var(--primary);
      font-size:0.7rem; padding:2px 8px; border-radius:10px; font-weight:700; margin-bottom:0.6rem; }

    /* Empty state */
    .empty-state { text-align:center; padding:3rem 1rem; color:var(--text2); }
    .empty-state svg { margin-bottom:0.75rem; opacity:0.35; }
    .empty-state h4 { font-size:1rem; color:var(--text); margin-bottom:0.4rem; }

    /* Light mode */
    [data-theme="light"] .account-sidebar  { background:#fff; }
    [data-theme="light"] .account-user-card{ background:linear-gradient(135deg,rgba(8,145,178,0.07),rgba(8,145,178,0.02)); }
    [data-theme="light"] .account-card     { background:#fff; }
    [data-theme="light"] .fg input,
    [data-theme="light"] .fg textarea,
    [data-theme="light"] .fg select        { background:var(--input-bg); color:var(--text); }
    [data-theme="light"] .purchase-item    { background:var(--surface-light); }
    [data-theme="light"] .notif-row        { background:var(--surface-light); }
    [data-theme="light"] .voucher-card     { background:rgba(8,145,178,0.03); }
    [data-theme="light"] .addr-card        { background:rgba(8,145,178,0.04); border-color:rgba(8,145,178,0.25); }
  </style>
</head>
<body>
  <div id="page-loader">
    <img src="/public/logo2.png" alt="" class="loader-logo" onerror="this.style.display='none'">
    <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
    <span class="loader-text">My Account</span>
  </div>
  <div id="toast-container"></div>
  <header id="nav"></header>

  <div class="account-layout">
    <aside class="account-sidebar">
      <div class="account-user-card">
        <div class="account-avatar" id="acct-avatar">?</div>
        <div class="u-name"  id="acct-name">Loading…</div>
        <div class="u-email" id="acct-email"></div>
      </div>
      <nav class="account-nav">
        <a href="#profile"       data-tab="profile"       class="active">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Profile</a>
        <a href="#purchases" data-tab="purchases">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span>My Purchases</a>
        <a href="#notifications" data-tab="notifications">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>Notifications</a>
        <a href="#vouchers" data-tab="vouchers">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></span>My Vouchers</a>
        <a href="#addresses" data-tab="addresses">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>Addresses</a>
        <a href="#payment" data-tab="payment">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span>Banks &amp; Cards</a>
        <a href="#security" data-tab="security">
          <span class="acct-nav-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>Change Password</a>
      </nav>
    </aside>

    <main class="account-main" id="account-main">
      <div class="account-card">
        <p style="color:var(--text2);text-align:center;padding:2rem;">Loading account…</p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-bottom"><p>© 2025 Arduino Store.</p></div>
  </footer>

  <script type="module" src="/src/main.js"></script>
  <script type="module">
    import { createClient } from '@supabase/supabase-js'
    const supa = createClient(
      'https://tyhocgrjwxswxzzfvwct.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5aG9jZ3Jqd3hzd3h6emZ2d2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1Mjc2MzcsImV4cCI6MjA4MzEwMzYzN30.UqmldkZ-MYBoeDJYKCOPgWi9-06S5w1-w4g-7qAUZKE'
    )

    /* toast */
    window.showToast = (title, msg, type = 'info', dur = 3500) => {
      const ico = { success:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`, error:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`, info:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>` }
      const c = document.getElementById('toast-container')
      const t = document.createElement('div')
      t.className = `toast ${type}`
      t.innerHTML = `<span class="toast-icon">${ico[type]||ico.info}</span><div class="toast-title">${title}</div>${msg?`<div class="toast-msg">${msg}</div>`:''}`
      c.appendChild(t)
      setTimeout(() => { t.classList.add('hiding'); setTimeout(() => t.remove(), 300) }, dur)
    }
    window.addEventListener('load', () => setTimeout(() => document.getElementById('page-loader')?.classList.add('hidden'), 600))

    /* auth check */
    const { data: { session } } = await supa.auth.getSession()
    if (!session) { location.href = '/login.html'; throw new Error('not auth') }

    const user = session.user
    let profile = {}

    const { data: pd } = await supa.from('profiles').select('*').eq('id', user.id).single()
    if (pd) profile = pd

    /* populate sidebar */
    const displayName = profile.first_name || user.email.split('@')[0]
    document.getElementById('acct-avatar').textContent = displayName.substring(0,2).toUpperCase()
    document.getElementById('acct-name').textContent = [profile.first_name, profile.last_name].filter(Boolean).join(' ') || displayName
    document.getElementById('acct-email').textContent = user.email

    /* svg helpers */
    const NICONS = {
      welcome:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
      promo:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
      wishlist_sale:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
      cart_stock:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
      system:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    }
    const CLOCK = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
    const EYE     = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
    const EYE_OFF = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    const CARD_BIG = `<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`
    const SHIP_BIG = `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`

    /* ── switchTab — defined before any call ── */
    function switchTab(tabName) {
      document.querySelectorAll('.account-nav a').forEach(a => a.classList.remove('active'))
      const link = document.querySelector(`.account-nav a[data-tab="${tabName}"]`)
      if (link) link.classList.add('active')
      loadTab(tabName)
    }
    window.switchTab = switchTab

    /* nav click listeners */
    document.querySelectorAll('.account-nav a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault()
        const tab = a.getAttribute('data-tab')
        history.replaceState(null, '', `#${tab}`)
        switchTab(tab)
      })
    })

    /* ── loadTab ── */
    async function loadTab(tab) {
      const main = document.getElementById('account-main')
      main.innerHTML = `<div class="account-card"><p style="color:var(--text2);text-align:center;padding:2rem;">Loading…</p></div>`

      /* PROFILE */
      if (tab === 'profile') {
        main.innerHTML = `
          <div class="account-card">
            <h3>Profile Information</h3>
            <div class="form-grid">
              <div class="fg"><label>First Name</label><input id="pf-fname" value="${escHtml(profile.first_name||'')}" placeholder="Juan"></div>
              <div class="fg"><label>Middle Name</label><input id="pf-mname" value="${escHtml(profile.middle_name||'')}" placeholder="Santos"></div>
              <div class="fg"><label>Last Name</label><input id="pf-lname" value="${escHtml(profile.last_name||'')}" placeholder="Dela Cruz"></div>
              <div class="fg"><label>Suffix</label><input id="pf-suffix" value="${escHtml(profile.suffix||'')}" placeholder="Jr., III…"></div>
              <div class="fg full"><label>Username</label><input id="pf-uname" value="${escHtml(profile.username||'')}" placeholder="juandelacruz"></div>
              <div class="fg full"><label>Email</label><input value="${escHtml(user.email)}" disabled></div>
              <div class="fg full"><label>Contact Number</label><input id="pf-phone" value="${escHtml(profile.contact_number||'')}" placeholder="+63 9XX XXX XXXX"></div>
              <div class="fg full"><label>Default Address</label><textarea id="pf-addr">${escHtml(profile.address||'')}</textarea></div>
            </div>
            <button class="btn-primary" style="margin-top:1.25rem;padding:0.75rem 2rem;" id="save-btn">Save Changes</button>
          </div>`

        document.getElementById('save-btn').addEventListener('click', async () => {
          const updates = {
            first_name:     document.getElementById('pf-fname').value.trim(),
            middle_name:    document.getElementById('pf-mname').value.trim(),
            last_name:      document.getElementById('pf-lname').value.trim(),
            suffix:         document.getElementById('pf-suffix').value.trim(),
            username:       document.getElementById('pf-uname').value.trim(),
            contact_number: document.getElementById('pf-phone').value.trim(),
            address:        document.getElementById('pf-addr').value.trim(),
          }
          const { error } = await supa.from('profiles').upsert({ id: user.id, ...updates })
          if (error) { showToast('Error', error.message, 'error'); return }
          profile = { ...profile, ...updates }
          document.getElementById('acct-name').textContent = [updates.first_name, updates.last_name].filter(Boolean).join(' ') || user.email.split('@')[0]
          showToast('Saved!', 'Profile updated successfully.', 'success')
        })
      }

      /* PURCHASES */
      else if (tab === 'purchases') {
        const { data: orders, error } = await supa
          .from('orders').select('*, order_items(*, products(name, img_url))')
          .eq('user_id', user.id).order('created_at', { ascending: false })
        if (error) { main.innerHTML = `<div class="account-card"><p style="color:var(--error)">Failed to load orders: ${error.message}</p></div>`; return }
        if (!orders?.length) {
          main.innerHTML = `<div class="account-card"><h3>My Purchases</h3>
            <div class="empty-state">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
              <h4>No orders yet</h4><p>Browse our catalogue and place your first order!</p>
              <a href="/products.html" class="btn-primary" style="display:inline-block;margin-top:1rem;padding:0.65rem 1.5rem;font-size:0.9rem;">Shop Now</a>
            </div></div>`; return
        }
        const stMap = { pending:'pending', processing:'processing', shipped:'shipped', delivered:'delivered', cancelled:'cancelled' }
        main.innerHTML = `<div class="account-card"><h3>My Purchases (${orders.length})</h3>
          ${orders.map(o => {
            const img = o.order_items?.[0]?.products?.img_url || '/public/product.png'
            const st = stMap[o.status] || 'pending'
            return `<div class="purchase-item">
              <img src="${img}" alt="Order" onerror="this.src='/public/product.png'">
              <div class="p-info">
                <div class="p-name">Order #${o.id.substring(0,8).toUpperCase()}</div>
                <div class="p-date">${new Date(o.created_at).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</div>
                <div style="color:var(--text2);font-size:0.77rem;margin-top:2px;">${o.order_items?.length||0} item(s) · ₱${(o.total_cents/100).toFixed(2)}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <span class="p-badge ${st}">${(o.status||'pending').toUpperCase()}</span>
                ${o.status==='delivered'?`<div style="margin-top:0.4rem;"><a href="/order-complete.html" style="font-size:0.77rem;color:var(--primary);">Rate &amp; Review</a></div>`:''}
              </div>
            </div>`
          }).join('')}
        </div>`
      }

      /* NOTIFICATIONS */
      else if (tab === 'notifications') {
        const { data: notifs, error } = await supa
          .from('notifications').select('*')
          .eq('user_id', user.id).order('created_at', { ascending: false }).limit(30)
        if (error) { main.innerHTML = `<div class="account-card"><p style="color:var(--error)">Failed to load notifications.</p></div>`; return }
        main.innerHTML = `<div class="account-card"><h3>Notifications</h3>
          ${notifs?.length ? notifs.map(n => `
            <div class="notif-row ${n.is_read?'':'unread'}">
              <span class="notif-ico">${NICONS[n.type]||NICONS.system}</span>
              <div style="flex:1;">
                <div class="notif-title">${escHtml(n.title||'Notification')}</div>
                <div class="notif-body">${escHtml(n.message||'')}</div>
                <div class="notif-time">${new Date(n.created_at).toLocaleString('en-PH')}</div>
              </div>
              ${!n.is_read?`<span class="unread-dot"></span>`:''}
            </div>`).join('')
          : `<div class="empty-state">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <h4>No notifications yet</h4><p>We'll notify you about orders and promos.</p>
            </div>`}
        </div>`
      }

      /* VOUCHERS */
      else if (tab === 'vouchers') {
        const { data: promos, error } = await supa
          .from('promos').select('*')
          .gte('valid_until', new Date().toISOString()).order('valid_until')
        if (error) { main.innerHTML = `<div class="account-card"><p style="color:var(--error)">Failed to load vouchers.</p></div>`; return }
        main.innerHTML = `<div class="account-card">
          <h3>My Vouchers &amp; Active Promos</h3>
          <p style="color:var(--text2);font-size:0.85rem;margin-bottom:1.25rem;">Use these codes at checkout.</p>
          ${promos?.length ? promos.map(pr => `
            <div class="voucher-card">
              <div class="voucher-pct">${pr.is_free_shipping ? SHIP_BIG : pr.discount_percent+'%'}</div>
              <div style="flex:1;">
                <div class="v-code">${pr.code}</div>
                <div class="v-desc">${escHtml(pr.description || (pr.is_free_shipping ? 'Free shipping on qualifying orders' : `${pr.discount_percent}% off your order`))}</div>
                <div class="v-expiry">${CLOCK} Expires: ${new Date(pr.valid_until).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</div>
              </div>
              <button data-code="${pr.code}" class="copy-voucher-btn" style="background:var(--primary);color:#000;border:none;border-radius:var(--radius-sm);padding:0.5rem 0.9rem;font-weight:700;cursor:pointer;font-size:0.82rem;white-space:nowrap;">Copy</button>
            </div>`).join('')
          : `<div class="empty-state">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg>
              <h4>No active vouchers</h4><p>Check back soon for new promos!</p>
            </div>`}
        </div>`
        document.querySelectorAll('.copy-voucher-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const code = btn.getAttribute('data-code')
            navigator.clipboard?.writeText(code).then(() => showToast('Copied!', `Code ${code} ready to use.`, 'success', 2000))
          })
        })
      }

      /* ADDRESSES */
      else if (tab === 'addresses') {
        main.innerHTML = `<div class="account-card">
          <h3>Saved Addresses</h3>
          <div class="addr-card">
            <span class="addr-default">DEFAULT</span>
            <div style="font-weight:600;color:var(--text);">${escHtml([profile.first_name,profile.last_name].filter(Boolean).join(' ')||'Name not set')}</div>
            <div style="color:var(--text2);font-size:0.9rem;margin-top:0.3rem;line-height:1.5;">${escHtml(profile.address||'No address saved yet.')}</div>
            ${profile.contact_number?`<div style="color:var(--text2);font-size:0.85rem;margin-top:0.2rem;">${escHtml(profile.contact_number)}</div>`:''}
          </div>
          <p style="color:var(--text2);font-size:0.84rem;">
            To update your address, go to your
            <a href="#profile" style="color:var(--primary);" id="go-profile-link">Profile</a>.
          </p></div>`
        document.getElementById('go-profile-link').addEventListener('click', e => { e.preventDefault(); history.replaceState(null,'','#profile'); switchTab('profile') })
      }

      /* PAYMENT */
      else if (tab === 'payment') {
        main.innerHTML = `<div class="account-card">
          <h3>Banks &amp; Cards</h3>
          <p style="color:var(--text2);font-size:0.88rem;margin-bottom:1.5rem;">Manage your saved payment methods for faster checkout.</p>
          <div style="border:2px dashed var(--border);border-radius:var(--radius);padding:2.5rem;text-align:center;color:var(--text2);">
            <div style="display:flex;justify-content:center;margin-bottom:0.75rem;opacity:0.4;">${CARD_BIG}</div>
            <p style="margin-bottom:1rem;">No saved payment methods yet.</p>
            <button onclick="showToast('Coming Soon','Payment method saving is coming soon!','info')" class="btn-primary" style="padding:0.65rem 1.5rem;font-size:0.9rem;">+ Add Payment Method</button>
          </div></div>`
      }

      /* SECURITY */
      else if (tab === 'security') {
        main.innerHTML = `<div class="account-card">
          <h3>Change Password</h3>
          <div class="fg" style="max-width:400px;margin-bottom:1rem;">
            <label>New Password</label>
            <div class="pw-wrap"><input type="password" id="new-pass" placeholder="Enter new password"><button class="pw-toggle" id="tog1">${EYE}</button></div>
          </div>
          <div class="fg" style="max-width:400px;margin-bottom:1.5rem;">
            <label>Confirm New Password</label>
            <div class="pw-wrap"><input type="password" id="con-pass" placeholder="Confirm new password"><button class="pw-toggle" id="tog2">${EYE}</button></div>
          </div>
          <button class="btn-primary" style="padding:0.75rem 2rem;" id="change-pw-btn">Update Password</button>
        </div>`

        const togPw = (id, btn) => {
          const inp = document.getElementById(id)
          inp.type = inp.type === 'password' ? 'text' : 'password'
          btn.innerHTML = inp.type === 'password' ? EYE : EYE_OFF
        }
        document.getElementById('tog1').addEventListener('click', function(){ togPw('new-pass', this) })
        document.getElementById('tog2').addEventListener('click', function(){ togPw('con-pass', this) })
        document.getElementById('change-pw-btn').addEventListener('click', async () => {
          const np = document.getElementById('new-pass').value
          const cp = document.getElementById('con-pass').value
          if (np.length < 8) { showToast('Weak password', 'At least 8 characters required.', 'error'); return }
          if (np !== cp)     { showToast('Mismatch', 'Passwords do not match.', 'error'); return }
          const { error } = await supa.auth.updateUser({ password: np })
          if (error) { showToast('Error', error.message, 'error'); return }
          showToast('Updated!', 'Password changed successfully.', 'success')
          document.getElementById('new-pass').value = ''
          document.getElementById('con-pass').value = ''
        })
      }
    }

    /* HTML escape helper to prevent XSS in templates */
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    }

    /* ── Trigger initial tab AFTER all functions are defined ── */
    const initialTab = location.hash?.replace('#','') || 'profile'
    switchTab(initialTab)
  </script>
</body>
</html>
