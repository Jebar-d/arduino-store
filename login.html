<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="nav"></header>
  
  <main class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your Arduino Store account</p>
      
      <form id="form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="pass">Password</label>
          <input id="pass" type="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="auth-button">Sign In</button>
      </form>
      
      <p class="auth-footer">
        No account? <a href="#" id="signup">Create one</a>
      </p>
      <p id="status" class="auth-status"></p>
    </div>
  </main>
  
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    import { signIn, signUp } from '/src/auth.js'
    
    const form = document.getElementById('form')
    const status = document.getElementById('status')
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      status.textContent = 'Signing in...'
      status.className = 'auth-status'
      
      const { data, error } = await signIn(form.email.value, form.pass.value)
      
      if (error) {
        status.textContent = error.message
        status.className = 'auth-status error'
      } else {
        location.href = '/'
      }
    })
    
    document.getElementById('signup').onclick = async (e) => {
      e.preventDefault()
      status.textContent = 'Creating account...'
      
      const { data, error } = await signUp(form.email.value, form.pass.value)
      
      if (error) {
        status.textContent = error.message
        status.className = 'auth-status error'
      } else {
        status.textContent = 'Check your email to confirm!'
        status.className = 'auth-status success'
      }
    }
  </script>
</body>
</html>
