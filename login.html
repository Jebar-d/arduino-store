<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Arduino Store</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="nav"></header>
  
  <main class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="auth-button">Sign In</button>
        
        <p class="auth-footer">
          Don't have an account? <a href="/signup.html">Create one</a>
        </p>
        
        <p id="status" class="auth-status"></p>
      </form>
    </div>
  </main>
  
  <script type="module" src="/src/main.js"></script>
  <script type="module">
    import { createClient } from '@supabase/supabase-js'
    
    const supa = createClient(
      'https://tyhocgrjwxswxzzfvwct.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5aG9jZ3Jqd3hzd3h6emZ2d2N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1Mjc2MzcsImV4cCI6MjA4MzEwMzYzN30.UqmldkZ-MYBoeDJYKCOPgWi9-06S5w1-w4g-7qAUZKE'
    )
    
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault()
      const status = document.getElementById('status')
      status.textContent = 'Signing in...'
      status.className = 'auth-status'
      
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      
      // Step 1: Sign in
      const { data, error } = await supa.auth.signInWithPassword({
        email: email,
        password: password
      })
      
      if (error) {
        status.textContent = error.message
        status.className = 'auth-status error'
        return
      }
      
      // Step 2: Check if email is verified
      if (!data.user.email_confirmed_at) {
        status.innerHTML = `
          <span style="color:#f66">Email not verified!</span><br>
          <small>Please check your email and click the confirmation link.<br>
          <a href="#" onclick="resendEmail('${email}')" style="color:var(--primary)">Resend confirmation email</a></small>
        `
        // Sign out immediately since not verified
        await supa.auth.signOut()
        return
      }
      
      // Success - redirect
      status.textContent = 'Success! Redirecting...'
      status.className = 'auth-status success'
      setTimeout(() => location.href = '/', 1000)
    }
    
    window.resendEmail = async (email) => {
      const status = document.getElementById('status')
      status.textContent = 'Resending...'
      
      const { error } = await supa.auth.resend({
        type: 'signup',
        email: email
      })
      
      if (error) {
        status.textContent = 'Error: ' + error.message
      } else {
        status.innerHTML = '<span style="color:#0f6">Confirmation email resent!</span>'
      }
    }
  </script>
</body>
</html>
